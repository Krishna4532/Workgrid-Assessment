services:
  postgres:
    image: postgres:16-alpine
    container_name: workgrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workgrid}
      POSTGRES_USER: ${POSTGRES_USER:-workgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workgrid_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workgrid} -d ${POSTGRES_DB:-workgrid}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.example
    environment:
      APP_ENV: development
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - postgres
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.example
    command: ["python", "-m", "app.worker"]
    depends_on:
      - postgres
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
    name: workgrid_pgdata
